<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" shape-rendering="crispEdges">
  <!-- Authentic 1999 GTA 2 Industrial Dusk Palette -->
  <rect width="800" height="520" fill="#57524b"/>
  <!-- Grass courtyard top-left -->
  <rect x="0" y="0" width="330" height="210" fill="#3b4d2b"/>
  <rect x="20" y="20" width="280" height="170" fill="#465934" stroke="#635e56" stroke-width="6"/>

  <!-- Asphalt Roads -->
  <rect x="0" y="210" width="800" height="120" fill="#2c2a28"/>
  <rect x="330" y="0" width="120" height="520" fill="#2c2a28"/>
  <!-- Curbs -->
  <rect x="0" y="204" width="800" height="6" fill="#787268"/>
  <rect x="0" y="330" width="800" height="6" fill="#787268"/>
  <!-- Road markings (faded ochre) -->
  <g fill="#c89d42">
    <rect x="20" y="267" width="44" height="6"/>
    <rect x="100" y="267" width="44" height="6"/>
    <rect x="180" y="267" width="44" height="6"/>
    <rect x="260" y="267" width="44" height="6"/>
    <rect x="480" y="267" width="44" height="6"/>
    <rect x="560" y="267" width="44" height="6"/>
    <rect x="640" y="267" width="44" height="6"/>
    <rect x="720" y="267" width="44" height="6"/>
    <rect x="387" y="20" width="6" height="44"/>
    <rect x="387" y="100" width="6" height="44"/>
    <rect x="387" y="360" width="6" height="44"/>
    <rect x="387" y="440" width="6" height="44"/>
  </g>

  <!-- Galych House with pitched tiled roof & chimney -->
  <rect x="54" y="42" width="220" height="140" fill="#141311"/>
  <rect x="42" y="30" width="220" height="140" fill="#734b36" stroke="#2a241e" stroke-width="4"/>
  <rect x="52" y="40" width="200" height="114" fill="#8b4532"/>
  <rect x="52" y="94" width="200" height="8" fill="#59281c"/>
  <rect x="74" y="54" width="22" height="22" fill="#4f463d" stroke="#222" stroke-width="2"/>

  <!-- Panelka (Top Right) -->
  <rect x="494" y="40" width="276" height="150" fill="#141311"/>
  <rect x="480" y="26" width="276" height="150" fill="#4f4d4a" stroke="#22201c" stroke-width="4"/>
  <rect x="492" y="38" width="252" height="120" fill="#3a3834"/>
  <rect x="510" y="54" width="48" height="32" fill="#2a2825"/>
  <rect x="650" y="54" width="64" height="44" fill="#2a2825"/>
  <rect x="505" y="156" width="28" height="14" fill="#e6a13e"/>
  <rect x="625" y="156" width="28" height="14" fill="#8d6b99"/>

  <!-- Station & Diesel Train (Bottom Left) -->
  <rect x="40" y="358" width="270" height="140" fill="#3a3631" stroke="#22201c" stroke-width="4"/>
  <rect x="52" y="410" width="246" height="50" fill="#2b4c7e" stroke="#c89d42" stroke-width="3"/>
  <rect x="68" y="422" width="38" height="22" fill="#e6c873"/>
  <rect x="118" y="422" width="38" height="22" fill="#e6c873"/>
  <rect x="168" y="422" width="38" height="22" fill="#e6c873"/>
  <rect x="220" y="422" width="58" height="22" fill="#9fb3c8"/>

  <!-- Vintage Cars -->
  <rect x="145" y="226" width="54" height="26" fill="#9c3024" stroke="#141311" stroke-width="2"/>
  <rect x="161" y="230" width="22" height="18" fill="#8aa39b"/>
  <rect x="545" y="284" width="54" height="26" fill="#c89d42" stroke="#141311" stroke-width="2"/>
  <rect x="561" y="288" width="22" height="18" fill="#8aa39b"/>

  <!-- Banner -->
  <rect x="24" y="182" width="752" height="148" fill="#171614" fill-opacity="0.94" stroke="#e59a24" stroke-width="4"/>
  <rect x="32" y="190" width="736" height="132" fill="none" stroke="#b83527" stroke-width="2"/>
  <text x="400" y="224" text-anchor="middle" fill="#7a9e4b" font-family="monospace" font-size="16" font-weight="900" letter-spacing="3">GTA 2 EDITION // ГАЛИЧ-СІТІ</text>
  <text x="400" y="278" text-anchor="middle" fill="#e59a24" font-family="Impact, Arial Black, sans-serif" font-size="48" font-weight="900" letter-spacing="2">ВРЯТУВАТИ РЯДОВОГО ВАСЮ</text>
  <text x="400" y="308" text-anchor="middle" fill="#d6b87c" font-family="monospace" font-size="14" font-weight="700">[ РОЗШУК • ПИВО • МОРСЬКІ СВИНКИ • ВАСИЛІВКА • ДИЗЕЛЬ ]</text>
</svg>
